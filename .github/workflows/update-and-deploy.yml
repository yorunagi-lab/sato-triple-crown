name: Update stats and deploy

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # JST 06:10, 17:10, 21:10, 21:40, 22:40, 23:40, 01:10
    - cron: '10 21 * * *'
    - cron: '10 8 * * *'
    - cron: '10 12 * * *'
    - cron: '40 12 * * *'
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
    - cron: '10 16 * * *'

concurrency:
  group: sato-stats-and-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCRAPING_ENABLED: ${{ vars.SCRAPING_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculations and failure handling
        run: |
          python -m unittest discover -s tests -v
          node --test tests/logic.test.mjs
          node scripts/check_static.mjs
      - name: Fetch and validate current season
        id: stats
        continue-on-error: true
        run: python scripts/update_data.py --mode scheduled
      - name: Save data and update status
        run: |
          if ! git diff --quiet -- dist/data.json dist/fetch-status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dist/data.json dist/fetch-status.json
            git commit -m 'data: refresh Sato triple crown snapshot'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Make failed fetch visible in Actions after publishing its warning
        if: steps.stats.outcome == 'failure'
        run: exit 1
